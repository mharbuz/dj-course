<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">Video Lesson Downloader</div>

  <div id="loading" class="loading">Scanning page...</div>
  <div id="no-videos" class="message hidden">No videos found on this page.</div>
  <div id="error" class="message error hidden"></div>

  <div id="video-list" class="hidden"></div>

  <div id="settings" class="settings hidden">
    <div class="field-row">
      <label for="module">Module:</label>
      <input type="number" id="module" min="1" max="99" value="1">
      <label for="lesson">Lesson:</label>
      <input type="number" id="lesson" min="1" max="99" value="1">
    </div>
    <div class="field-row">
      <label for="subfolder">Subfolder:</label>
      <input type="text" id="subfolder" placeholder="course-name">
    </div>
    <div class="preview">
      Save as: <span id="filename-preview">—</span>
    </div>
    <button id="download-btn" class="download-btn">Download</button>
    <div id="status" class="status">Ready</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
